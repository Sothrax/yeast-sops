name: Stale SOP Report

on:
  schedule:
    # Každou neděli v 6:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  stale-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Run stale check
        id: stale
        run: |
          python scripts/validate.py --stale > stale-report.txt || true
          {
            echo 'REPORT<<EOF'
            cat stale-report.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create or update issue
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.stale.outputs.REPORT }}`;
            const title = "Stale SOP review needed";
            const body = `Automated weekly stale check.\n\n\`\`\`\n${report}\n\`\`\``;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "stale-sop",
            });

            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["stale-sop"],
              });
            }
